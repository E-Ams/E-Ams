<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title">
	<title id="title">Evert Amsenga, software developer building desktop apps, firmware, APIs and automation</title>
	<style>
		.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
		.mono { font-family: ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }

		/* Slowly drifting green glows, like the portfolio background. */
		.glow-a { animation: drift-a 18s ease-in-out infinite alternate; }
		.glow-b { animation: drift-b 22s ease-in-out infinite alternate; }
		@keyframes drift-a { to { transform: translate(140px, 40px); } }
		@keyframes drift-b { to { transform: translate(-160px, -30px); } }

		/* The logo floats a little. */
		.logo { animation: float 6s ease-in-out infinite; }
		@keyframes float { 50% { transform: translateY(-8px); } }

		/* "Open to work" dot pulses. */
		.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
		@keyframes pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }

		/* One word at a time after "I build". */
		.word { opacity: 0; transform-box: fill-box; animation: cycle 12s infinite; animation-fill-mode: backwards; }
		.word:nth-of-type(1) { opacity: 1; animation-delay: 0s; }
		.word:nth-of-type(2) { animation-delay: 3s; }
		.word:nth-of-type(3) { animation-delay: 6s; }
		.word:nth-of-type(4) { animation-delay: 9s; }
		@keyframes cycle {
			0% { opacity: 0; transform: translateY(14px); }
			4% { opacity: 1; transform: translateY(0); }
			21% { opacity: 1; transform: translateY(0); }
			25% { opacity: 0; transform: translateY(-14px); }
			100% { opacity: 0; transform: translateY(-14px); }
		}

		/* A signal trace that sweeps across, like a monitor. */
		.trace { stroke-dasharray: 260 1400; animation: sweep 4.5s linear infinite; }
		@keyframes sweep { from { stroke-dashoffset: 260; } to { stroke-dashoffset: -1400; } }

		@media (prefers-reduced-motion: reduce) {
			.glow-a, .glow-b, .logo, .pulse, .word, .trace { animation: none; }
			.trace { stroke-dasharray: none; }
		}
	</style>
	<defs>
		<radialGradient id="glow" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#3fbf7f" stop-opacity="0.35" />
			<stop offset="1" stop-color="#3fbf7f" stop-opacity="0" />
		</radialGradient>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
			<circle cx="12" cy="12" r="1.1" fill="#223029" />
		</pattern>
		<linearGradient id="fade" x1="0" x2="1">
			<stop offset="0" stop-color="#3fbf7f" stop-opacity="0" />
			<stop offset="0.5" stop-color="#3fbf7f" />
			<stop offset="1" stop-color="#8fe0b5" />
		</linearGradient>
		<clipPath id="card"><rect width="1200" height="340" rx="18" /></clipPath>
	</defs>

	<g clip-path="url(#card)">
		<rect width="1200" height="340" fill="#0b100e" />
		<ellipse class="glow-a" cx="260" cy="90" rx="420" ry="260" fill="url(#glow)" />
		<ellipse class="glow-b" cx="980" cy="300" rx="380" ry="240" fill="url(#glow)" opacity="0.7" />
		<rect width="1200" height="340" fill="url(#dots)" opacity="0.8" />

		<!-- Monitor trace along the bottom right -->
		<path d="M640 270 H760 L776 236 L792 300 L808 214 L824 284 L840 262 H940 L954 246 L968 278 L982 262 H1200" fill="none" stroke="#1f5c42" stroke-width="2" opacity="0.6" />
		<path class="trace" d="M640 270 H760 L776 236 L792 300 L808 214 L824 284 L840 262 H940 L954 246 L968 278 L982 262 H1200" fill="none" stroke="url(#fade)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

		<!-- Faceted evergreen logo, from the portfolio favicon -->
		<g class="logo">
			<g transform="translate(70 82) scale(2.75)">
				<rect width="64" height="64" rx="14" fill="#0b100e" />
				<rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#1f5c42" stroke-width="3" />
				<path d="M24 29H40L53 50H11Z" fill="#3fbf7f" />
				<path d="M32 29H40L53 50H32Z" fill="#1f5c42" />
				<path d="M32 7L46 31H18Z" fill="#8fe0b5" />
				<path d="M32 7L46 31H32Z" fill="#2a8a5c" />
				<path d="M32 36L38 46H26Z" fill="#0b100e" />
				<path d="M29 50H35V57H29Z" fill="#e8eee9" />
			</g>
		</g>

		<!-- Open to work -->
		<rect x="290" y="62" width="150" height="32" rx="16" fill="#14301f" stroke="#1f5c42" />
		<circle class="pulse" cx="310" cy="78" r="5" fill="#3fbf7f" />
		<circle cx="310" cy="78" r="5" fill="#3fbf7f" />
		<text x="324" y="83.5" class="sans" font-size="15" fill="#e8eee9">Open to work</text>

		<text x="288" y="158" class="sans" font-size="58" font-weight="700" fill="#e8eee9" letter-spacing="-1">Evert Amsenga</text>
		<text x="290" y="196" class="sans" font-size="20" fill="#93a39a">Software Developer · BSc IT (Software Engineering)</text>

		<text x="290" y="248" class="mono" font-size="24" fill="#93a39a">I build</text>
		<g class="mono" font-size="24" font-weight="600" fill="#3fbf7f">
			<text class="word" x="400" y="248">desktop apps</text>
			<text class="word" x="400" y="248">firmware</text>
			<text class="word" x="400" y="248">APIs</text>
			<text class="word" x="400" y="248">automation</text>
		</g>

		<text x="1160" y="56" class="mono" font-size="15" fill="#93a39a" text-anchor="end">amsengine.dev</text>
	</g>
	<rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#223029" />
</svg>
